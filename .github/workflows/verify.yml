name: Verify MIZAN
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Run domain and API regression checks
        run: python -m pytest tests -q
      - name: Build website from frozen dependencies
        working-directory: frontend
        env:
          CI: 'true'
        run: |
          npx.cmd --yes pnpm@12.9.1 install --frozen-lockfile
          npx.cmd --yes pnpm@12.9.1 run build
